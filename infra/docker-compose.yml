# One-shot dev stack. Override with `.env` in repo root.
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novel2av
      POSTGRES_PASSWORD: novel2av
      POSTGRES_DB: novel2av
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel2av"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/novel2av || true;
      /usr/bin/mc anonymous set download local/novel2av || true;
      "

  backend-api:
    build: ../backend
    environment:
      APP_HTTP_ADDR: ":8080"
      APP_DB_URL: postgres://novel2av:novel2av@postgres:5432/novel2av?sslmode=disable
      APP_REDIS_URL: redis://redis:6379/0
      APP_REDIS_AI_URL: redis://redis:6379/1
      APP_S3_ENDPOINT: minio:9000
      APP_S3_ACCESS_KEY: minioadmin
      APP_S3_SECRET_KEY: minioadmin
      APP_S3_BUCKET: novel2av
      APP_S3_REGION: us-east-1
      APP_LOG_LEVEL: info
    depends_on: [postgres, redis, minio]
    ports: ["8080:8080"]

  ai-engine:
    build: ../ai-engine
    environment:
      AI_REDIS_URL: redis://redis:6379/1
      AI_S3_ENDPOINT: minio:9000
      AI_S3_ACCESS_KEY: minioadmin
      AI_S3_SECRET_KEY: minioadmin
      AI_S3_BUCKET: novel2av
      AI_LOG_LEVEL: info
    depends_on: [redis, minio]
    deploy:
      replicas: 1

  ai-engine-sidecar:
    build: ../ai-engine
    command: ["uvicorn", "app.sidecar:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      AI_REDIS_URL: redis://redis:6379/1
    depends_on: [redis]
    ports: ["8000:8000"]

  web:
    build: ../frontend
    depends_on: [backend-api]
    ports: ["5173:80"]

volumes:
  pgdata: {}
  miniodata: {}
